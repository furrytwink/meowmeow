# Custom selene standard library for the roblox-modular project.
#
# selene resolves `std = "executor"` from this file (executor.yml).
# `base: roblox` layers on top of the generated Roblox standard library
# (run `selene generate-roblox-std` once if roblox.yml is missing).
#
# Every executor/Luau-protection global is declared as an untyped `any`
# value: selene then verifies variable existence and code lints, but does
# not second-guess executor call signatures. The payloads legitimately
# re-shim some of these (e.g. `gethui = gethui or get_hidden_gui`), which
# is allowed for Any-kind globals.
base: roblox
name: executor
globals:
  syn:
    any: true
  game:
    any: true
  Enum:
    any: true
  debug:
    any: true
  Drawing:
    any: true
  EXTRACT:
    any: true
  LPH_ATTRIBUTES:
    any: true
  LPH_OBFUSCATED:
    any: true
  NONE:
    any: true
